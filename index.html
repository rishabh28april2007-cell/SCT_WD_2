 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator - Task 02</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1f4037, #99f2c8);
    }

    .calculator {
      background: #22252d;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      width: 320px;
    }

    .display {
      width: 100%;
      height: 60px;
      background: #2a2d37;
      border: none;
      outline: none;
      border-radius: 10px;
      font-size: 2rem;
      color: #ffffff;
      text-align: right;
      padding: 10px 15px;
      margin-bottom: 20px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 16px;
      font-size: 1.2rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #2a2d37;
      color: #fff;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #383c49;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-op {
      color: #eb6440;
    }

    .btn-clear {
      color: #ff5252;
    }

    .btn-equal {
      background: #eb6440;
      color: #ffffff;
      grid-column: span 2;
    }

    .btn-equal:hover {
      background: #d85432;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <input type="text" id="display" class="display" readonly placeholder="0" />
    <div class="buttons">
      <button class="btn-clear" onclick="clearDisplay()">C</button>
      <button class="btn-op" onclick="deleteLast()">DEL</button>
      <button class="btn-op" onclick="appendValue('/')">/</button>
      <button class="btn-op" onclick="appendValue('*')">*</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="btn-op" onclick="appendValue('-')">-</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="btn-op" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('.')">.</button>

      <button onclick="appendValue('0')">0</button>
      <button onclick="appendValue('00')">00</button>
      <button class="btn-equal" onclick="calculateResult()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(val) {
      if (display.value === '0' && val !== '.') {
        display.value = val;
      } else {
        display.value += val;
      }
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function calculateResult() {
      try {
        if (display.value.trim() !== '') {
          display.value = eval(display.value);
        }
      } catch (err) {
        display.value = 'Error';
      }
    }

    // Keyboard support requirement
    document.addEventListener('keydown', (e) => {
      if ((e.key >= '0' && e.key <= '9') || ['+', '-', '*', '/', '.'].includes(e.key)) {
        appendValue(e.key);
      } else if (e.key === 'Enter' || e.key === '=') {
        calculateResult();
      } else if (e.key === 'Backspace') {
        deleteLast();
      } else if (e.key === 'Escape') {
        clearDisplay();
      }
    });
  </script>
</body>
</html>
